# HAProxy TCP mode in front of the Atlas Registry port (:8081) for heartbeat
# fan-in (TODO v0.1.19). Atlas replicas are stateless: any replica can accept
# any heartbeat, so plain round-robin is enough. See docs/ha.md.
global
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# ── Registry fan-in: game server heartbeats ─────────────────────────────
# Active health checks hit the registry root; a replica that fails them is
# pulled from rotation automatically.
frontend registry_front
    bind *:8081
    default_backend atlas_registry

backend atlas_registry
    balance roundrobin
    option tcp-check
    tcp-check connect
    server atlas1 atlas1:8081 check inter 5s fall 3 rise 2
    server atlas2 atlas2:8081 check inter 5s fall 3 rise 2

# ── Public API pass-through (optional, use a real LB/gateway in prod) ───
frontend public_front
    bind *:8080
    default_backend atlas_public

backend atlas_public
    balance roundrobin
    option tcp-check
    tcp-check connect
    server atlas1 atlas1:8080 check inter 5s fall 3 rise 2
    server atlas2 atlas2:8080 check inter 5s fall 3 rise 2

# ── Admin API: pin to ONE replica ────────────────────────────────────────
# The audit log is an in-memory ring, so admin views (GET /v1/admin/audit)
# are per-replica. Keep admin traffic sticky to a single replica, or put a
# real LB with consistent hashing in front.
frontend admin_front
    bind *:8082
    default_backend atlas_admin

backend atlas_admin
    balance source
    server atlas1 atlas1:8082 check inter 5s fall 3 rise 2 backup
    server atlas2 atlas2:8082 check inter 5s fall 3 rise 2

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
