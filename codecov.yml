# Codecov configuration — this file drives the coverage metrics.
# Note: main is a protected branch, so Codecov requires uploads to carry a
# token (tokenless uploads are rejected with "Token required because branch is
# protected", confirmed in practice). Once the repository secret CODECOV_TOKEN
# is configured (free for public repos), uploads work; until then the badge
# shows unknown.
# Coverage is positioned as a trend signal (informational): report only, do
# not block merges on global number fluctuations;
# the hard pre-commit gates remain local go build / vet / test (see .github/workflows/ci.yml).

codecov:
  require_ci_to_pass: true

coverage:
  status:
    # Project level: gate 98% (user directive, 2026-10-31). The hard gate is
    # local `make test-coverage` (requires SQL/Redis contract containers, see
    # Makefile); CI has no containers, the SQL contract suite skips, and the
    # uploaded number is about 16 points lower — expected, so this stays
    # informational for trend only and does not block merges.
    project:
      default:
        target: 98%
        informational: true
    # Patch level: coverage of newly added/changed code
    patch:
      default:
        target: auto
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  # Service entry wiring (no logic) and generated gRPC code
  - "cmd/**"
  - "api/**"
  # Test-support package: uncovered lines are t.Fatalf failure branches
  # (honest coverage would mean the test failed); excluded under the same
  # scope as the local make test-coverage gate (todo.md)
  - "internal/store/storetest/**"
  # Non-Go artifacts and samples (SDKs in six languages / dashboard / docs / deployment / plugin example)
  - "sdk/**"
  - "dashboard/**"
  - "docs/**"
  - "examples/**"
  - "deploy/**"
  - "deployments/**"
  - "plugins/**"
