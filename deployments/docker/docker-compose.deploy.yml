# Atlas demo deployment stack (docker compose, all GHCR prebuilt images, no local build)
#
# Purpose: bring up a "live" Atlas demo environment on a single docker host —
# Atlas API + PostgreSQL + Redis + dashboard (nginx serving the frontend,
# same-origin reverse proxy to the three listening ports) + demo fleet
# simulator (continuous register/heartbeat, so the dashboard and the
# server-picker page have real data).
#
# Difference from the repo-root docker-compose.yml: the root one is "developers
# start the backend with one command" (local build, adjustable ports); this
# file is "CI pulls images and deploys directly" (the deploy host needs no
# source tree and no go/npm toolchain), executed by
# .github/workflows/deploy-docker.yml on a self-hosted runner.
#
# Usage (run in the deployment directory; deploy_dir contains only this file and .env):
#   docker compose --env-file .env -f docker-compose.yml pull
#   docker compose --env-file .env -f docker-compose.yml up -d
#
# Ports (.env can override; watch for conflicts with existing host services;
# defaults are the 18xxx range chosen for the deploy host):
#   ATLAS_PUBLIC_PORT  public Discovery/Directory/Routing → dashboard nginx reverse proxy (default 18080)
#   ATLAS_REGISTRY_PORT registry domain (game-server access, internal-only in the demo; default 18083)
#   ATLAS_ADMIN_PORT   admin port (ops/dashboard reverse proxy; not directly public by topology design; default 18084)
#   ATLAS_GRPC_PORT    gRPC (default 18090)
#   DASHBOARD_PORT     dashboard nginx (the only externally exposed port, with TLS termination in front; default 18088)

name: atlas-demo

services:
  atlas:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/atlas:${ATLAS_TAG:-latest}
    container_name: atlas-demo
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ATLAS_STORE: postgres
      ATLAS_DATABASE_URL: postgres://atlas:${ATLAS_PG_PASSWORD:-atlas}@postgres:5432/atlas?sslmode=disable
      ATLAS_REDIS_URL: redis://redis:6379/0
      # The demo uses Redis Streams for config-center notifications: game servers
      # in subscribe mode receive change signals on the atlas.config topic
      # (version number only, then fetch the full document).
      ATLAS_EVENT_ADAPTER: redis
      # crossserver_url in the signal is built from the public base URL; with
      # TLS termination in front of the demo domain this becomes
      # https://atlas.cuihairu.site
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL:-http://localhost:${DASHBOARD_PORT:-8090}}
      # Admin API auth (generated by the deploy workflow on first deployment and
      # written to .env, never checked into the repository):
      # ATLAS_ADMIN_ROLES pins the demo key to viewer (read-only), the admin key to admin.
      ATLAS_ADMIN_API_KEYS: ${ATLAS_ADMIN_API_KEYS:-}
      ATLAS_ADMIN_ROLES: ${ATLAS_ADMIN_ROLES:-}
    ports:
      - "${ATLAS_PUBLIC_PORT:-18080}:8080"
      - "${ATLAS_REGISTRY_PORT:-18083}:8081"
      - "${ATLAS_ADMIN_PORT:-18084}:8082"
      - "${ATLAS_GRPC_PORT:-18090}:9090"
    healthcheck:
      # The distroless image has no shell/curl; the health probe calls the binary's built-in subcommand directly
      test: ["CMD", "/atlas", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Dashboard: nginx serves the frontend static assets and reverse-proxies
  # /v1/admin, /v1/registry, /v1/crossserver and the rest of /v1 to atlas's
  # three listening ports respectively — the browser only talks same-origin,
  # so there is no CORS.
  dashboard:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/atlas-dashboard:${DASHBOARD_TAG:-latest}
    container_name: atlas-demo-dashboard
    restart: unless-stopped
    depends_on:
      atlas:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-18088}:80"
      # The Cloudflare tunnel's ingress is remote-managed configuration that
      # routes atlas.cuihairu.site back to 192.168.5.5:8082 (if the cloud side
      # cannot be changed, catch it on the ground): the dashboard takes over
      # host port 8082 the same way, so the domain reaches the dashboard nginx
      # straight through the tunnel; the 18xxx direct ports are unaffected.
      # /v1/admin etc. are still same-origin proxied by nginx to the atlas
      # admin listener.
      - "${ATLAS_TUNNEL_PORT:-8082}:80"
    healthcheck:
      # In Alpine containers localhost resolves to ::1 first, while nginx only
      # listens on IPv4 — the health probe must use 127.0.0.1, otherwise a
      # healthy service still reports connection refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Demo fleet: a set of simulated game-server processes (register/heartbeat/
  # character writes/config hot reload).
  # When not needed: docker compose stop demoagents, or set the profile to "off".
  demoagents:
    image: ghcr.io/${GHCR_OWNER:-cuihairu}/atlas:${ATLAS_TAG:-latest}
    container_name: atlas-demo-agents
    restart: unless-stopped
    entrypoint: ["/demoagents"]
    depends_on:
      atlas:
        condition: service_healthy
    command:
      - -registry=http://atlas:8081
      - -public=http://atlas:8080
      - -admin=http://atlas:8082
      - -interval=10s
      - -poll-interval=30s
      - -redis-url=redis://redis:6379/0
      - -watch-server=game-1001
      - -http=:9098
    healthcheck:
      # No shell/curl in distroless: the probe subcommand calls its own status
      # endpoint, so a stopped heartbeat reports unhealthy (ATLAS_DEMOAGENTS_HTTP_ADDR
      # must match -http).
      test: ["CMD", "/demoagents", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    environment:
      ATLAS_DEMOAGENTS_HTTP_ADDR: ":9098"
      # The demo fleet lays out realm/shard topology, sets tags/maintenance
      # windows — all via admin API calls, which require the admin key once
      # admin auth is enabled (in .env, the same key as the admin-role entry in
      # ATLAS_ADMIN_API_KEYS).
      ATLAS_ADMIN_KEY: ${ATLAS_ADMIN_KEY:-}

  # One-shot table-creation service: runs the PostgreSQL migrations in
  # migrations/ then exits (exit 0); atlas waits for its success before
  # starting. Runs the PG variants only, skipping *_mysql.sql.
  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: atlas
      PGPASSWORD: ${ATLAS_PG_PASSWORD:-atlas}
      PGDATABASE: atlas
    volumes:
      - ${ATLAS_MIGRATIONS_DIR:-./migrations}:/migrations:ro
    # Shell variables must be written $$f: a bare $f would be interpolated by compose itself into an empty string
    entrypoint: ["sh", "-c", "for f in /migrations/0*.sql; do case \"$$f\" in *_mysql.sql) continue ;; esac; echo \"applying $$f\"; psql -v ON_ERROR_STOP=1 -f \"$$f\" || exit 1; done"]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: atlas-demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${ATLAS_PG_PASSWORD:-atlas}
      POSTGRES_DB: atlas
    volumes:
      - atlas-demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: atlas-demo-redis
    restart: unless-stopped
    # Heartbeat/runtime state and the event stream are ephemeral, no persistent volume
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  atlas-demo-pgdata: