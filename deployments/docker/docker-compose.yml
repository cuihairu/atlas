services:
  atlas:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ATLAS_STORE: postgres
      ATLAS_DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
      ATLAS_REDIS_URL: redis://redis:6379/0
    volumes:
      - ../../migrations:/migrations:ro

  # Schema bootstrap: the distroless Atlas image has no shell / psql, so
  # migrations run through this one-shot service against PostgreSQL
  # (exits when done; atlas waits for its success before starting).
  # Runs the PG variants only, skipping *_mysql.sql.
  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: atlas
      PGPASSWORD: atlas
      PGDATABASE: atlas
    volumes:
      - ../../migrations:/migrations:ro
    # Shell variables must be written $$f: a bare $f would be interpolated by compose itself into an empty string.
    entrypoint: ["sh", "-c", "for f in /migrations/0*.sql; do case \"$$f\" in *_mysql.sql) continue ;; esac; echo \"applying $$f\"; psql -v ON_ERROR_STOP=1 -f \"$$f\" || exit 1; done"]

  postgres:
    image: postgres:17-alpine
    # Host mappings use shifted ports to avoid clashing with the dev machine's
    # long-running PG/Redis; Atlas connects directly via container names on the
    # docker network and does not use these mappings.
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
