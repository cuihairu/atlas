# SLG 策略 demo —— 长驻世界服 + 联盟战临时跨服（赛季/合服语义）。
#
# 一键起（在本目录执行）：
#   docker compose up -d --build
# 管理台: http://localhost:28230
# 收尾:   docker compose down -v
#
# 端口段 28230-28235（与其他品类 demo 错开，可并行起）。
name: atlas-demo-slg

services:
  atlas:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ATLAS_STORE: postgres
      ATLAS_DATABASE_URL: postgres://atlas:atlas@postgres:5432/atlas?sslmode=disable
      ATLAS_REDIS_URL: redis://redis:6379/0
      # 世界服/联盟战都是 subscribe 模式收跨服拓扑变更（赛季编排靠它）
      ATLAS_EVENT_ADAPTER: redis
      ATLAS_PUBLIC_URL: http://localhost:28231
    ports:
      - "28231:8080"
      - "28232:8081"
      - "28233:8082"
    healthcheck:
      test: ["CMD", "/atlas", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: atlas
      PGPASSWORD: atlas
      PGDATABASE: atlas
    volumes:
      - ../../../migrations:/migrations:ro
    entrypoint: ["sh", "-c", "for f in /migrations/0*.sql; do case \"$$f\" in *_mysql.sql) continue ;; esac; echo \"applying $$f\"; psql -v ON_ERROR_STOP=1 -f \"$$f\" || exit 1; done"]

  postgres:
    image: postgres:17-alpine
    ports:
      - "28234:5432"
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "28235:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: ../../../dashboard
    depends_on:
      atlas:
        condition: service_healthy
    ports:
      - "28230:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  # SLG 舰队：3 个赛季世界服（长驻，subscribe 收赛季编排）+ 2 个联盟战
  # 临时跨服（4 分钟一个"战役日"，打完下线，休整 1 分钟开下一场）。
  demoagents:
    build:
      context: ../../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/demoagents"]
    depends_on:
      atlas:
        condition: service_healthy
    command:
      - -registry=http://atlas:8081
      - -public=http://atlas:8080
      - -admin=http://atlas:8082
      - -fleet=/fleet.json
      - -interval=10s
      - -poll-interval=30s
      - -redis-url=redis://redis:6379/0
      - -watch-server=slg-world-1
      - -http=:9098
    volumes:
      - ./fleet.json:/fleet.json:ro
    environment:
      ATLAS_DEMOAGENTS_HTTP_ADDR: ":9098"
    healthcheck:
      test: ["CMD", "/demoagents", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pgdata:
