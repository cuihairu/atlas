# APISIX example config: Atlas public entry point (shipped with v0.1.13)
#
# 1) Enable plugins (APISIX config.yaml):
#
#    plugins:                          # add to the existing list
#      - atlas-auth
#      - atlas-ratelimit
#
#    nginx_config:
#      http:
#        shared_dicts:                 # atlas-ratelimit counters
#          - atlas_ratelimit: 10m
#
#    plugin_attr:                      # optional: fallback when no global default is available
#      ...
#
# 2) Routes (this file can be used to initialize etcd or create each one via the Admin API):
#
#    curl http://127.0.0.1:9180/apisix/admin/routes/atlas -X PUT -H "X-API-KEY: $ADMIN_KEY" -d @config-example.yaml
#
#    (the content is carried by the data: key; you can also paste it directly into an Admin API request body)

name: atlas
uri: /v1/*
upstream:
  nodes:
    "atlas:8080": 1          # Atlas public port (merged proxy also serves registry/admin)
  type: roundrobin
plugins:
  atlas-auth:
    token_header: X-Player-Token
    account_header: X-Atlas-Player-ID
    required: true
    strip_token: true
    accounts:                 # static mapping example; replace with token-service validation in production
      demo-token-alice: 1001
      demo-token-bob: 1002
  atlas-ratelimit:
    groups:
      - prefix: /v1/registry   # tighter limits on write paths
        rate: 50
        window: 60
      - prefix: /v1/directory
        rate: 300
        window: 60
      - prefix: /v1/routing    # high-frequency path during login peaks
        rate: 1000
        window: 60
      - prefix: /v1/discovery
        rate: 600
        window: 60
    default_rate: 0            # paths not listed are not rate limited
    rejected_code: 429
