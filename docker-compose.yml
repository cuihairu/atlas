# ─────────────────────────────────────────────────────────────────────────────
# Atlas quick start — bring up the full stack with one command (Atlas + PostgreSQL + Redis + schema bootstrap)
#
# Usage (run in this file's directory):
#   cp .env.example .env          # secrets (e.g. database password) go in .env only, not hard-coded here
#   docker compose up -d
#   curl http://localhost:8080/healthz      # {"status":"ok"} means the stack is up
#
# Where data persists:
#   - PostgreSQL (server records / character index / migration history) → named
#     volume atlas_pgdata; `docker volume inspect atlas_pgdata` shows the actual
#     host path; only `down -v` deletes the data.
#   - Redis (runtime state such as heartbeats, ephemeral by nature) → no volume;
#     a container rebuild clears it, which is expected.
#
# How to change versions:
#   - Atlas image: edit ATLAS_IMAGE in .env (latest = newest rolling build of
#     main; can be pinned to a bare short SHA (e.g. e3f802d) or a date tag;
#     use a local tag for locally built dev images).
#   - PostgreSQL / Redis: change the image tag of the corresponding service below.
#
# How to change config: Atlas is driven entirely by ATLAS_* environment
# variables (the same set as running the binary bare) — add or remove entries
# in atlas.environment below; see README "Docker quick start" for common items
# and docs/sync.md for the event bus.
# ─────────────────────────────────────────────────────────────────────────────

name: atlas

services:
  atlas:
    image: ${ATLAS_IMAGE:-ghcr.io/cuihairu/atlas:latest}
    # No need for --pull always on first pull; users tracking main's rolling updates can add pull_policy: always
    container_name: atlas
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully   # create tables first, then start the service
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ATLAS_STORE: postgres
      ATLAS_DATABASE_URL: postgres://atlas:${ATLAS_PG_PASSWORD:-atlas}@postgres:5432/atlas?sslmode=disable
      ATLAS_REDIS_URL: redis://redis:6379/0
      # Optional: buffer character writes asynchronously over the message bus
      # (default http = in-process synchronous).
      # Example: ATLAS_EVENT_ADAPTER: redis   # reuse this stack's Redis; the write endpoint returns 202
      # See docs/sync.md for more adapters and variables.
    ports:
      - "8080:8080"   # public: Discovery / Directory / Routing (player clients, gateways)
      - "8081:8081"   # internal: Registry register/heartbeat (game servers)
      - "8082:8082"   # admin: Admin / audit / Prometheus /metrics
      - "9090:9090"   # gRPC (same features over a high-performance channel, optional for the Go SDK)
    healthcheck:
      # The distroless image has no shell/curl; the health probe calls the binary's built-in subcommand directly
      test: ["CMD", "/atlas", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # One-shot table-creation service: runs all PostgreSQL migrations in
  # migrations/ then exits (exit 0); atlas waits for its success before
  # starting. The official postgres image ships psql, so migrations do not go
  # into the app image (the app image is distroless, no shell). Schema changes
  # are additive only — never modify published migration files.
  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: atlas
      PGPASSWORD: ${ATLAS_PG_PASSWORD:-atlas}
      PGDATABASE: atlas
    volumes:
      - ./migrations:/migrations:ro
    # Shell variables must be written $$f: a bare $f would be interpolated by compose itself into an empty string
    entrypoint: ["sh", "-c", "for f in /migrations/0*.sql; do case \"$$f\" in *_mysql.sql) continue ;; esac; echo \"applying $$f\"; psql -v ON_ERROR_STOP=1 -f \"$$f\" || exit 1; done"]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      # Password read from .env (secrets not hard-coded); defaults to atlas locally — use a strong password in production
      POSTGRES_PASSWORD: ${ATLAS_PG_PASSWORD:-atlas}
      POSTGRES_DB: atlas
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to the host by default (only Atlas reaches it on the docker network).
    # Uncomment for local psql debugging:
    # ports:
    #   - "127.0.0.1:15432:5432"

  redis:
    image: redis:8-alpine
    container_name: atlas-redis
    restart: unless-stopped
    # Heartbeat/runtime state is ephemeral data, no persistent volume; losing runtime state on container rebuild is expected
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment for local redis-cli debugging:
    # ports:
    #   - "127.0.0.1:16379:6379"

volumes:
  atlas_pgdata:
