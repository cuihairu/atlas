// Atlas service definitions — gRPC feature parity with the REST API
// (docs/api.md). Timestamps are RFC 3339 strings, matching the JSON API.
//
// Regenerate with: make proto
syntax = "proto3";

package atlas.v1;

option go_package = "github.com/cuihairu/atlas/api/pb;atlaspb";

// ── Shared messages ──────────────────────────────────────────────────────

message Endpoint {
  string host = 1;
  int32 port = 2;
}

message Server {
  string id = 1;
  string name = 2;
  string type = 3;
  string region = 4;
  string realm_id = 5;
  string shard_id = 6;
  string version = 7;
  string platform = 8;
  Endpoint endpoint = 9;
  int32 capacity = 10;
  map<string, string> metadata = 11;
  string status = 12;
  int32 players = 13;
  double load = 14;
  string last_seen_at = 15;
  string created_at = 16;
  string updated_at = 17;
}

message Character {
  int64 account_id = 1;
  string server_id = 2;
  int64 character_id = 3;
  string name = 4;
  int32 level = 5;
  int32 class_id = 6;
  string avatar = 7;
  map<string, string> metadata = 8;
  string last_login_at = 9;
  string created_at = 10;
  string updated_at = 11;
}

// ── Registry ─────────────────────────────────────────────────────────────

message RegisterRequest {
  string server_id = 1;
  string name = 2;
  string type = 3;
  string region = 4;
  string realm_id = 5;
  string shard_id = 6;
  string version = 7;
  string platform = 8;
  Endpoint endpoint = 9;
  int32 capacity = 10;
}

message RegisterResponse {
  Server server = 1;
}

message HeartbeatRequest {
  string server_id = 1;
  int32 players = 2;
  double load = 3;
  string status = 4;
}

message HeartbeatResponse {
  string server_id = 1;
  string status = 2;
  int32 next_heartbeat_in = 3;
}

message UnregisterRequest {
  string server_id = 1;
}

message UnregisterResponse {
  string server_id = 1;
  string status = 2;
}

service RegistryService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);
}

// ── Discovery ────────────────────────────────────────────────────────────

message ListServersRequest {
  string status = 1;
  string region = 2;
  string realm = 3;
  string shard = 4;
  string version = 5;
  string platform = 6;
  int32 limit = 7;
  string cursor = 8;
}

message ListServersResponse {
  repeated Server servers = 1;
}

message GetServerRequest {
  string server_id = 1;
}

message GetServerResponse {
  Server server = 1;
}

service DiscoveryService {
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc GetServer(GetServerRequest) returns (GetServerResponse);
}

// ── Directory ────────────────────────────────────────────────────────────

message CreateCharacterRequest {
  int64 account_id = 1;
  string server_id = 2;
  int64 character_id = 3;
  string name = 4;
  int32 level = 5;
  int32 class_id = 6;
}

message CreateCharacterResponse {
  Character character = 1;
  // "created" on the synchronous adapter, "queued" on asynchronous ones.
  string status = 2;
}

message GetCharacterRequest {
  int64 character_id = 1;
}

message GetCharacterResponse {
  Character character = 1;
}

message ListCharactersByAccountRequest {
  int64 account_id = 1;
}

message ListCharactersByAccountResponse {
  repeated Character characters = 1;
}

message ListCharactersByServerRequest {
  string server_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListCharactersByServerResponse {
  repeated Character characters = 1;
  string next_cursor = 2;
}

// UpdateCharacterRequest: absent (default) fields mean "no change",
// matching the JSON PATCH semantics.
message UpdateCharacterRequest {
  int64 account_id = 1;
  string server_id = 2;
  int64 character_id = 3;
  optional string name = 4;
  optional int32 level = 5;
  optional int32 class_id = 6;
  optional string avatar = 7;
}

message UpdateCharacterResponse {
  Character character = 1;
  string status = 2;
}

message DeleteCharacterRequest {
  int64 character_id = 1;
}

message DeleteCharacterResponse {
  string status = 1;
}

service DirectoryService {
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);
  rpc GetCharacter(GetCharacterRequest) returns (GetCharacterResponse);
  rpc ListCharactersByAccount(ListCharactersByAccountRequest) returns (ListCharactersByAccountResponse);
  rpc ListCharactersByServer(ListCharactersByServerRequest) returns (ListCharactersByServerResponse);
  rpc UpdateCharacter(UpdateCharacterRequest) returns (UpdateCharacterResponse);
  rpc DeleteCharacter(DeleteCharacterRequest) returns (DeleteCharacterResponse);
}

// ── Routing ──────────────────────────────────────────────────────────────

message RecommendRequest {
  int64 account_id = 1;
  string region = 2;
  string version = 3;
  string platform = 4;
  string status = 5;
}

message RecommendResponse {
  Server server = 1;
  string reason = 2;
}

service RoutingService {
  rpc Recommend(RecommendRequest) returns (RecommendResponse);
}

// ── Admin ────────────────────────────────────────────────────────────────

message ServerIdRequest {
  string server_id = 1;
}

message OkResponse {
  string server_id = 1;
  string status = 2;
}

message GetStatsRequest {}

message GetStatsResponse {
  int32 total_servers = 1;
  map<string, int32> servers_by_status = 2;
  map<string, int32> servers_by_region = 3;
  map<string, int32> servers_by_version = 4;
  int32 total_players = 5;
  int32 total_capacity = 6;
  int32 total_characters = 7;
}

message SearchCharactersRequest {
  string name = 1;
  string server_id = 2;
  optional int32 class_id = 3;
  optional int32 min_level = 4;
  optional int32 max_level = 5;
  int32 limit = 6;
  string cursor = 7;
}

message SearchCharactersResponse {
  repeated Character characters = 1;
  string next_cursor = 2;
}

message Migration {
  string id = 1;
  repeated string source_servers = 2;
  string target_server = 3;
  string status = 4;
  string started_at = 5;
  string completed_at = 6;
}

message CreateMigrationRequest {
  repeated string source_servers = 1;
  string target_server = 2;
}

message CreateMigrationResponse {
  Migration migration = 1;
}

message GetMigrationRequest {
  string migration_id = 1;
}

message GetMigrationResponse {
  Migration migration = 1;
}

message ListMigrationsRequest {
  int32 limit = 1;
}

message ListMigrationsResponse {
  repeated Migration migrations = 1;
}

message RollbackMigrationRequest {
  string migration_id = 1;
}

message RollbackMigrationResponse {
  Migration migration = 1;
}

service AdminService {
  rpc SetMaintenance(ServerIdRequest) returns (OkResponse);
  rpc SetDrain(ServerIdRequest) returns (OkResponse);
  rpc Enable(ServerIdRequest) returns (OkResponse);
  rpc Disable(ServerIdRequest) returns (OkResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc SearchCharacters(SearchCharactersRequest) returns (SearchCharactersResponse);
  rpc CreateMigration(CreateMigrationRequest) returns (CreateMigrationResponse);
  rpc GetMigration(GetMigrationRequest) returns (GetMigrationResponse);
  rpc ListMigrations(ListMigrationsRequest) returns (ListMigrationsResponse);
  rpc RollbackMigration(RollbackMigrationRequest) returns (RollbackMigrationResponse);
}
