version: 2

updates:
  # Go modules (root module + SDK)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # Dashboard（React / antd / charts）
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      dashboard-dev:
        dependency-type: development

  # Docs site (VitePress)
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-dev:
        dependency-type: development
    ignore:
      # vitepress-plugin-mermaid@2.0.17 only peer-depends on mermaid 10||11;
      # mermaid ^12 makes npm ci fail with ERESOLVE (docs.yml breaks; see the
      # Deploy Docs failures after 87a29c9). Remove this entry once the
      # plugin supports 12.
      - dependency-name: mermaid
        versions: [">=12"]
