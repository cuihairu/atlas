# Recurring security audit (docs/security-audit.md): dependency vulnerability
# scanning. Complements Dependabot — Dependabot handles routine upgrades,
# this workflow is an independent second line of review;
# govulncheck fails on known vulnerabilities that are **actually called**,
# npm audit fails on high+.
name: security-audit

on:
  schedule:
    - cron: "37 3 * * 1" # Mondays at 03:37 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            docs/package-lock.json

      - name: npm audit (dashboard, prod deps)
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (docs, prod deps)
        working-directory: docs
        run: npm audit --omit=dev --audit-level=high
