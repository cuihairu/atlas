# Nightly builds (rolling nightly): four kinds of native packages go into the
# rolling `nightly` release.
#
# Iron rule, aligned with the repo red lines: this workflow only maintains the
# prerelease rolling nightly publication — no version number, no tag, no
# formal Release. Formal releases can only be triggered manually by a maintainer.
#
# The four artifacts (asset naming atlas-nightly-<os>-<arch>.<ext>):
#   linux amd64/arm64 deb + rpm (single nfpm config, arch mapped amd64→x86_64)
#   windows amd64 exe zip (native executable) + msi (WiX v3, windows runner)
#   all assets are sealed off by SHA256SUMS.
name: nightly

on:
  schedule:
    # Off-peak, off the hour: 03:31 UTC daily (11:31 Beijing), avoiding the Actions rush
    - cron: '31 3 * * *'
  workflow_dispatch: # manual trigger must exist (also used for first-round validation)

permissions:
  contents: read

concurrency:
  group: atlas-nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether nightly is needed
    runs-on: ubuntu-latest
    # Run only in this repo: fork triggers never publish this project's releases
    if: github.event_name == 'workflow_dispatch' || github.repository == 'cuihairu/atlas'
    outputs:
      skip: ${{ steps.stagnation.outputs.skip }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history is needed for the 48h check

      - name: Stagnation gate (48h no new commits on main -> skip)
        if: github.event_name == 'schedule'
        id: stagnation
        run: |
          LATEST=$(git log -1 --format=%ct origin/main)
          NOW=$(date +%s)
          DIFF_HOURS=$(( (NOW - LATEST) / 3600 ))
          if [ "$DIFF_HOURS" -ge 48 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "no commit for $DIFF_HOURS h -> skip"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "last commit $DIFF_HOURS h ago -> build"
          fi

  gate:
    # Same correctness gate as ci.yml: nightly assets only ever come from
    # verified commits. The three store contract suites are gated via env vars
    # pointing at the containers below; unset means the suites skip automatically.
    name: Existing correctness gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: atlas_test
          MYSQL_USER: atlas
          MYSQL_PASSWORD: atlas
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ATLAS_TEST_DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_test?sslmode=disable
      ATLAS_TEST_MYSQL_DSN: atlas:atlas@tcp(127.0.0.1:3306)/atlas_test
      ATLAS_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Gofmt
        run: |
          dirs="$(go list -f '{{.Dir}}' ./...)"
          if [ -z "$dirs" ]; then echo "go list returned no packages"; exit 1; fi
          output="$(gofmt -l $dirs)"
          if [ -n "$output" ]; then echo "$output"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=10m
      - name: Test
        run: |
          go test ./internal/... -count=1
          go test ./cmd/... ./sdk/... ./api/... ./examples/... ./deploy/... -count=1

  linux-packages:
    name: Native Linux packages (deb + rpm)
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # CGO_ENABLED=0 pure-Go cross-compilation: both amd64 and arm64 are built on the amd64 runner.
      - name: Build static binaries
        run: |
          mkdir -p dist stage
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/cuihairu/atlas/internal/version.GitCommit=${COMMIT} -X github.com/cuihairu/atlas/internal/version.BuildDate=${DATE}"
          for arch in amd64 arm64; do
            echo ">> linux/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "$LDFLAGS" -o "dist/atlas-linux-${arch}" ./cmd/atlas
          done
          ls -l dist

      # Smoke test proves the linux binary runs: start the service (in-memory store), then hit healthz.
      - name: Smoke amd64 binary (serve + healthcheck)
        run: |
          export ATLAS_HTTP_ADDR=127.0.0.1:18091
          export ATLAS_REGISTRY_ADDR=127.0.0.1:18092
          export ATLAS_ADMIN_ADDR=127.0.0.1:18093
          export ATLAS_GRPC_ADDR=127.0.0.1:18094
          ./dist/atlas-linux-amd64 > /tmp/atlas-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            grep -q "starting Atlas" /tmp/atlas-smoke.log && break
            sleep 0.5
          done
          grep -q "starting Atlas" /tmp/atlas-smoke.log || { cat /tmp/atlas-smoke.log; exit 1; }
          ./dist/atlas-linux-amd64 healthcheck || { cat /tmp/atlas-smoke.log; exit 1; }
          echo "healthcheck exit 0"

      # One nfpm config produces deb+rpm; the version is a rolling build
      # sequence, not a release version number.
      # GOTOOLCHAIN=auto is scoped to this step only: recent nfpm releases
      # raise the Go floor (v2.47=1.26.4, v2.48=1.26.4, v2.49=1.27.4), while
      # setup-go installs go1.27.3 per go.mod's toolchain and sets
      # GOTOOLCHAIN=local, so `go install nfpm@v2.49.0` reports
      # "requires go >= 1.27.4 (running go 1.27.3)". Do not pin an nfpm
      # version — every nfpm release raises the floor, so pinning would break
      # on every release; auto lets nfpm fetch the toolchain it needs, while
      # our own go build still uses 1.27.3 per go.mod.
      - name: Install nfpm
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0

      - name: Package deb + rpm (amd64, arm64)
        run: |
          VERSION="0.0.0.nightly$(date -u +%Y%m%d)"
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) rpm_arch=x86_64 ;;
              arm64) rpm_arch=aarch64 ;;
            esac
            echo ">> $arch (rpm arch $rpm_arch)"
            rm -rf "stage-$arch" && mkdir -p "stage-$arch"
            cp "dist/atlas-linux-${arch}" "stage-$arch/atlas"
            cp .env.example LICENSE README.md "stage-$arch/"
            sed -e "s/^version:.*/version: \"${VERSION}\"/" \
                -e "s/^arch:.*/arch: ${arch}/" \
                deploy/packaging/nfpm.yaml > "stage-$arch/nfpm.yaml"
            ( cd "stage-$arch"
              nfpm package -f nfpm.yaml -p deb -t "../dist/atlas-nightly-linux-${arch}.deb"
              nfpm package -f nfpm.yaml -p rpm -t "../dist/atlas-nightly-linux-${rpm_arch}.rpm"
            )
          done
          ls -l dist
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Package structure self-check: the unpacked manifest must contain
      # /usr/bin/atlas and /etc/atlas/atlas.env.
      # The deb file list lives in the data layer, probed with dpkg -c rather
      # than control.tar; rpm -qlp includes a permissions column, so the last
      # column is the path.
      - name: Install rpm query tool
        run: sudo apt-get install -y rpm

      - name: Verify package contents
        run: |
          dpkg -c dist/atlas-nightly-linux-amd64.deb | grep -q ' ./usr/bin/atlas$'
          dpkg -c dist/atlas-nightly-linux-amd64.deb | grep -q ' ./etc/atlas/atlas.env$'
          rpm -qlp dist/atlas-nightly-linux-x86_64.rpm | awk '{print $NF}' | grep -qx '/usr/bin/atlas'
          rpm -qlp dist/atlas-nightly-linux-x86_64.rpm | awk '{print $NF}' | grep -qx '/etc/atlas/atlas.env'

      # Arch headers must match the filenames. Another repo's nightly only
      # renamed the files without writing the Arch field, so its arm64
      # packages reported x86_64 internally; here every package is compared
      # individually so the same mistake cannot pass silently.
      - name: Verify package arch headers
        run: |
          for pair in atlas-nightly-linux-x86_64.rpm:x86_64 \
                     atlas-nightly-linux-aarch64.rpm:aarch64; do
            f="${pair%%:*}"; want="${pair##*:}"
            got=$(rpm -qp --queryformat '%{ARCH}' "dist/$f")
            if [ "$got" != "$want" ]; then
              echo "rpm arch mismatch: $f claims $got, expected $want"; exit 1
            fi
            echo "  $f Arch=$got ok"
          done
          for pair in atlas-nightly-linux-amd64.deb:amd64 \
                     atlas-nightly-linux-arm64.deb:arm64; do
            f="${pair%%:*}"; want="${pair##*:}"
            got=$(dpkg-deb --field "dist/$f" Architecture)
            if [ "$got" != "$want" ]; then
              echo "deb arch mismatch: $f claims $got, expected $want"; exit 1
            fi
            echo "  $f Arch=$got ok"
          done

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-assets
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  windows-packages:
    name: Native Windows packages (exe zip + msi)
    runs-on: windows-latest
    needs: gate
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build windows exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, stage | Out-Null
          $commit = (git rev-parse --short HEAD)
          $date = Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ"
          $ldflags = "-s -w -X github.com/cuihairu/atlas/internal/version.GitCommit=$commit -X github.com/cuihairu/atlas/internal/version.BuildDate=$date"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags $ldflags -o stage\atlas.exe ./cmd/atlas
          Get-Item stage\atlas.exe | Select-Object Name, Length

      - name: Package exe zip
        shell: pwsh
        run: |
          Compress-Archive -Path stage\atlas.exe -DestinationPath dist\atlas-nightly-windows-amd64.zip
          Get-Item dist\atlas-nightly-windows-amd64.zip | Select-Object Name, Length

      # WiX v3 comes from choco; if the install or build fails, the msi leg is
      # honestly marked BLOCKED and never faked — all other assets go into
      # nightly as usual; see this step's log for the failure reason.
      - name: Install WiX Toolset v3
        shell: pwsh
        continue-on-error: true
        run: choco install wixtoolset -y --no-progress

      - name: Build msi (WiX candle + light)
        shell: pwsh
        continue-on-error: true
        run: |
          $wixbin = (Get-Item "C:\Program Files (x86)\WiX Toolset v3*\bin" | Select-Object -First 1).FullName
          if (-not $wixbin) { Write-Error "WiX not found; msi leg BLOCKED"; exit 1 }
          # Bare positional args break here: Copy-Item has no Path2 parameter, so the
          # third and fourth names are "positional parameters that cannot be found".
          # Pass everything through -Path with an explicit -Destination.
          Copy-Item -Path LICENSE, README.md, .env.example, deploy\packaging\atlas.wxs -Destination stage\
          # File/@Source may be resolved against either the .wxs directory or the .wixobj
          # directory, depending on which stage re-reads it. Put the object in the SAME
          # directory as the payload so both candidates agree — otherwise light reports
          # LGHT0103 "cannot find the file 'atlas.exe'" because the payload sits in stage\
          # while the object was in build\.
          & "$wixbin\candle.exe" -arch x64 stage\atlas.wxs -o stage\atlas.wixobj
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$wixbin\light.exe" -spdb -o dist\atlas-nightly-windows-amd64.msi stage\atlas.wixobj
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Structural self-check + payload assertion. dark exiting 0 only
          # proves the msi parses (it does not install); an empty shell also
          # exits 0, so after extraction we must assert atlas.exe is really
          # inside and its byte count matches the source exe. Otherwise a
          # missing cab would still pass silently.
          $exeBytes  = (Get-Item stage\atlas.exe).Length
          $msiBytes  = (Get-Item dist\atlas-nightly-windows-amd64.msi).Length
          $extracted = "$env:RUNNER_TEMP\msi-extract"
          & "$wixbin\dark.exe" -x "$extracted" dist\atlas-nightly-windows-amd64.msi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $payload = Get-ChildItem -Recurse -Filter atlas.exe -Path "$extracted" |
            Select-Object -First 1
          if (-not $payload) {
            Write-Error "msi contains no atlas.exe payload ($msiBytes bytes) — empty shell"
            exit 1
          }
          if ($payload.Length -ne $exeBytes) {
            Write-Error "payload size mismatch: msi $($payload.Length) vs exe $exeBytes"
            exit 1
          }
          Write-Host "msi built and parsed; payload atlas.exe $exeBytes bytes matches source"
          Get-Item dist\atlas-nightly-windows-amd64.msi | Select-Object Name, Length

      - name: Record which artifacts shipped
        shell: pwsh
        run: |
          $msi = Get-Item dist\*.msi -ErrorAction SilentlyContinue
          if ($msi) {
            $bytes = ($msi | Measure-Object Length -Sum).Sum
            Write-Host "MSI_STATUS=ok ($bytes bytes)"
            "MSI shipped: $($msi.FullName) ($bytes bytes)" >> "$env:GITHUB_STEP_SUMMARY"
          } else {
            # No msi is NOT proof that WiX is missing: the leg can also fail after
            # WiX loaded (a bad copy, a rejected wxs, a light failure). Say which.
            $wixbin = Get-Item "C:\Program Files (x86)\WiX Toolset v3*\bin" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($wixbin) {
              Write-Host "MSI_STATUS=FAILED (WiX present; the msi step itself failed)"
              "MSI leg FAILED with WiX available — read the 'Build msi (WiX candle + light)' log; " +
                "this is a build failure, not a missing toolchain. " +
                "Local reproduction: choco install wixtoolset -y; copy the wxs next to the staged " +
                "payload; candle -arch x64 stage\atlas.wxs -o build\atlas.wixobj; " +
                "light -spdb -o out.msi build\atlas.wixobj; dark -x tmp out.msi" >> "$env:GITHUB_STEP_SUMMARY"
            } else {
              Write-Host "MSI_STATUS=BLOCKED (WiX unavailable on this runner)"
              "MSI leg BLOCKED: no WiX Toolset v3 on this runner. " +
                "Local verification: choco install wixtoolset -y; candle -arch x64 stage\atlas.wxs; " +
                "light -spdb out.msi build\*.wixobj; dark -x tmp out.msi" >> "$env:GITHUB_STEP_SUMMARY"
            }
          }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-assets
          # One glob, not two: when the msi leg is BLOCKED a second pattern
          # matching nothing makes the upload step fail the whole job.
          path: dist/*
          retention-days: 7

  release:
    name: Publish nightly (rolling)
    runs-on: ubuntu-latest
    needs: [gate, linux-packages, windows-packages]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-assets"
          path: dist
          merge-multiple: true

      - name: Checksums (all assets)
        run: |
          cd dist
          # Asset manifest: names + byte sizes, for the release notes
          : > ../asset-manifest.txt
          for f in *; do
            [ "$f" = SHA256SUMS ] && continue
            sz=$(stat -c %s "$f")
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            # The canonical sha256sum format is "<hash>  <name>" (hash first,
            # two spaces). Writing it backwards as "name  hash" leaves the
            # files in place but makes `sha256sum -c SHA256SUMS` report
            # "no properly formatted checksum lines found", rendering the
            # checksum seal worthless: downstream consumers could no longer
            # verify assets in one command.
            echo "${sum}  ${f}" >> SHA256SUMS
            echo "${f} ${sz}" >> ../asset-manifest.txt
          done
          # Generate and self-verify in one go: bad formatting fails here instead of shipping silently.
          sha256sum -c SHA256SUMS
          cat ../asset-manifest.txt
          # Final closure over the four artifacts: two deb + two rpm + one exe
          # zip are mandatory; the msi is recorded separately.
          need=(atlas-nightly-linux-amd64.deb atlas-nightly-linux-arm64.deb \
               atlas-nightly-linux-x86_64.rpm atlas-nightly-linux-aarch64.rpm \
               atlas-nightly-windows-amd64.zip)
          for f in "${need[@]}"; do
            if [ ! -f "$f" ]; then echo "missing required artifact: $f"; exit 1; fi
          done
          if [ ! -f atlas-nightly-windows-amd64.msi ]; then
            echo "msi asset absent -> msi leg BLOCKED this run (deb/rpm/zip still published)"
          fi
          cat SHA256SUMS

      # Rolling release: always the prerelease `nightly`; every run replaces
      # the previous asset set as a whole. Uses the gh CLI rather than a
      # release action (the action kept hitting 403 on the
      # update-an-existing-release path).
      - name: Rolling release to tag 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)"
          {
            echo "# Atlas Nightly Build"
            echo
            echo "**Commit**: [${COMMIT_SHA}](${COMMIT_URL}) — ${COMMIT_MSG}"
            echo "**Branch**: main"
            echo
            echo "## Assets"
            echo
            printf '```\n'
            cat asset-manifest.txt
            printf '```\n'
            echo
            echo "The deb/rpm sets are cross-compiled for amd64 and arm64; the"
            echo "amd64 binary is execution-smoked (serve + /healthz) and both"
            echo "package formats are unpacked and inspected. arm64 binaries are"
            echo "built on the CI host but not execution-smoked there."
            echo
            echo "> Rolling nightly channel: the tag stays \`nightly\` and each"
            echo "> build replaces the previous asset set. This is not a formal"
            echo "> versioned release."
          } > release-body.md

          ASSETS=(dist/*)
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --repo "${GITHUB_REPOSITORY}" \
              --title "Atlas Nightly (rolling)" \
              --notes-file release-body.md --prerelease
            gh release upload nightly --repo "${GITHUB_REPOSITORY}" "${ASSETS[@]}" --clobber
          else
            gh release create nightly --repo "${GITHUB_REPOSITORY}" \
              --title "Atlas Nightly (rolling)" \
              --notes-file release-body.md \
              --prerelease --latest=false "${ASSETS[@]}"
          fi

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[] | "\(.name) \(.size)"'

      - name: Remove superseded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r asset; do
            [ -f "dist/${asset}" ] && continue
            echo "dropping superseded ${asset}"
            gh release delete-asset nightly "${asset}" --repo "${GITHUB_REPOSITORY}" --yes
          done < <(gh release view nightly --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')

  verify-no-version-tags:
    name: Verify no version tag leaked
    runs-on: ubuntu-latest
    needs: release
    if: always() && needs.release.result == 'success'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Version tags must have a published release
        # The rolling nightly tag does not count. A tag without a Release =
        # suspected mis-push, still blocked.
        run: |
          set -uo pipefail
          TAGS=$(git ls-remote --tags origin | grep -v 'refs/tags/nightly$' | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}' || true)
          if [ -z "$TAGS" ]; then
            echo "only the nightly tag exists"; exit 0
          fi
          bad=""
          for t in $TAGS; do
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "  $t -> published release"
            else
              echo "  $t -> NO release (suspected mis-push)"; bad="$bad $t"
            fi
          done
          if [ -n "$bad" ]; then
            echo "unpublished version tags:$bad"; exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
