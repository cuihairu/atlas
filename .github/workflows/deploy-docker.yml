# Deploy to the self-hosted docker host (atlas.cuihairu.site demo environment)
#
# Division of labor vs docker-image.yml: that workflow builds and pushes to
# GHCR on GitHub-hosted runners; this one only does "pull images -> bring up
# the stack -> verify health -> roll back on failure", running on the deploy
# host's own runner (label atlas-docker100, isolated from other repos'
# runners, no queuing contention).
#
# The deploy host needs no source toolchain: the compose file and migrations/
# are synced over by this workflow; all images come from GHCR. Deployment is
# idempotent (re-running up -d with the same tag has no side effects).
#
# Gates and safeguards:
#   - Deploy only when green: wait for ci.yml and docker-image.yml to finish
#     successfully on this commit first (abort on failure/timeout; the deploy
#     host is never touched);
#   - Two-layer health verification: local 127.0.0.1 ports on the deploy host
#     + the live https://atlas.cuihairu.site/;
#   - Automatic rollback on failure: roll .env back to the previous set of
#     image tags, re-up and re-verify, then report failure (a first deployment
#     has no previous tags and only reports the error);
#   - Deployment record: the job summary carries the run link, commit,
#     container status and a live-site verification screenshot
#     (artifact: deploy-screenshot).
#
# Manual trigger (tag defaults to latest = latest rolling main):
#   gh workflow run deploy-docker.yml
#   gh workflow run deploy-docker.yml -f tag=<short SHA> -f deploy_dir=/data/deploy/atlas
name: Deploy Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（atlas 与 atlas-dashboard 共用；缺省 latest）"
        required: false
        default: "latest"
      deploy_dir:
        description: "部署机上的部署目录（compose 文件与 migrations/ 落在这里）"
        required: false
        default: "/data/deploy/atlas"

permissions:
  contents: read
  packages: read
  actions: read      # the gate reads ci / docker-image run conclusions

# Only one deployment may run at a time: concurrent up -d runs would --remove-orphans each other.
concurrency:
  group: deploy-docker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, atlas-docker100]
    # The job-level timeout must exceed gates (105m) + deploy and health
    # verification (about 30m): it was once set to 45m and the whole job got
    # force-killed before the gates finished.
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      # The demo key matches the README "Demo site" section (viewer read-only,
      # data reset periodically); used only when the deploy host's .env is
      # first generated — an existing .env is not overwritten.
      DEMO_KEY: demo-ab36cfc2cb77ac66ccd0523512efffbe
    steps:
      - name: Checkout
        timeout-minutes: 3
        uses: actions/checkout@v7.0.1

      # ── Gate: deploy only when main is green ─────────────────────
      # Wait for both workflows to finish on this commit: ci (tests) and
      # docker-image (image pushed). Poll while queued/in progress; abort
      # straight away on failure or timeout — the deploy host is not touched.
      # The polling budget is 100 minutes: docker-image must produce
      # amd64+arm64 (QEMU cross-build), which takes 20–60 minutes in practice
      # for this repo; the earlier 15-minute budget would mistime out while
      # the image was still missing.
      - name: Gate — main green (ci + image)
        timeout-minutes: 105
        run: |
          set -euo pipefail
          wait_green() {
            wf="$1"
            for _ in $(seq 1 300); do
              # This endpoint returns indented JSON ("status": "x" has
              # spaces); flatten it to one line before extracting fields,
              # otherwise the compact-mode grep never matches.
              err=/tmp/gate-err.$$
              resp="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&per_page=1" 2>"$err" || true)"
              flat="$(printf '%s' "$resp" | tr -d ' \n')"
              status="$(printf '%s' "$flat" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4 || true)"
              concl="$(printf '%s' "$flat" | grep -o '"conclusion":"[^"]*"' | head -1 | cut -d'"' -f4 || true)"
              run_url="$(printf '%s' "$flat" | grep -o '"html_url":"[^"]*actions/runs/[0-9]*"' | head -1 | cut -d'"' -f4 || true)"
              if [ -z "$status" ]; then
                echo "$wf: no run for $SHA yet (api: $(tr -d '\n' < "$err" | head -c 200)), retrying..."
              elif [ "$status" = "completed" ]; then
                if [ "$concl" = "success" ]; then
                  echo "$wf green — $run_url"
                  return 0
                fi
                echo "$wf $concl — $run_url" >&2
                return 1
              else
                echo "$wf $status — $run_url"
              fi
              sleep 20
            done
            echo "$wf: still not completed after 100m" >&2
            return 1
          }
          wait_green ci.yml
          wait_green docker-image.yml

      - name: Login GHCR
        timeout-minutes: 3
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Deploy dir and .env (record previous tags for failure rollback) ──
      - name: Prepare deploy directory
        timeout-minutes: 3
        run: |
          set -euo pipefail
          deploy_dir="${{ inputs.deploy_dir }}"
          # The runner may run as root (sudo is often absent on the deploy host):
          # pick the privilege-escalation prefix by availability
          sudo_cmd=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            sudo_cmd="sudo"
          fi
          $sudo_cmd mkdir -p "$deploy_dir"
          $sudo_cmd chown "$(id -u):$(id -g)" "$deploy_dir"
          # Compose and migration files travel with the deployment; content follows this checked-out commit
          cp deployments/docker/docker-compose.deploy.yml "$deploy_dir/docker-compose.yml"
          rm -rf "$deploy_dir/migrations"
          cp -r migrations "$deploy_dir/migrations"
          # Rollback target = the tags in .env before this deployment (empty on
          # first deployment = nothing to roll back to; on failure only the
          # error is reported, no rollback)
          prev_atlas=""
          prev_dash=""
          if [ -f "$deploy_dir/.env" ]; then
            prev_atlas="$(grep '^ATLAS_TAG=' "$deploy_dir/.env" | tail -1 | cut -d= -f2- || true)"
            prev_dash="$(grep '^DASHBOARD_TAG=' "$deploy_dir/.env" | tail -1 | cut -d= -f2- || true)"
          fi
          echo "PREV_ATLAS_TAG=$prev_atlas" >> "$GITHUB_ENV"
          echo "PREV_DASHBOARD_TAG=$prev_dash" >> "$GITHUB_ENV"
          # Keep only the variables this deployment needs (secrets never enter
          # version control; inherited from the host's existing .env)
          if [ ! -f "$deploy_dir/.env" ]; then
            cat > "$deploy_dir/.env" <<EOF
          ATLAS_TAG=${{ inputs.tag }}
          DASHBOARD_TAG=${{ inputs.tag }}
          GHCR_OWNER=${{ github.repository_owner }}
          ATLAS_PUBLIC_URL=https://atlas.cuihairu.site
          ATLAS_PUBLIC_PORT=18080
          ATLAS_REGISTRY_PORT=18083
          ATLAS_ADMIN_PORT=18084
          ATLAS_GRPC_PORT=18090
          DASHBOARD_PORT=18088
          EOF
          else
            # Existing .env (ops may have changed ports/secrets): only roll the
            # image tags (delete GHCR_OWNER first and rewrite it too, otherwise
            # every deployment appends another line)
            sed -i '/^ATLAS_TAG=/d;/^DASHBOARD_TAG=/d;/^GHCR_OWNER=/d' "$deploy_dir/.env"
            printf 'ATLAS_TAG=%s\nDASHBOARD_TAG=%s\nGHCR_OWNER=%s\n' \
              "${{ inputs.tag }}" "${{ inputs.tag }}" "${{ github.repository_owner }}" >> "$deploy_dir/.env"
          fi
          # Admin API auth keys: generated on first deployment (random key for
          # the admin; the demo key matches the README "Demo site" section and
          # is pinned to viewer read-only). If already present, keep as is.
          # Keys live only in the deploy host's .env, never in version control.
          if ! grep -q '^ATLAS_ADMIN_API_KEYS=' "$deploy_dir/.env"; then
            admin_key="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            {
              printf 'ATLAS_ADMIN_API_KEYS=%s,%s\n' "$admin_key" "$DEMO_KEY"
              printf 'ATLAS_ADMIN_ROLES=%s:admin,%s:viewer\n' "$admin_key" "$DEMO_KEY"
              printf 'ATLAS_ADMIN_KEY=%s\n' "$admin_key"
            } >> "$deploy_dir/.env"
            echo "generated admin API key (stored in .env only)"
          fi
          echo "--- deploy_dir/$deploy_dir ---"
          cat "$deploy_dir/.env" | sed "s/ATLAS_ADMIN_API_KEYS=.*/ATLAS_ADMIN_API_KEYS=<redacted>/"

      - name: Pull images
        timeout-minutes: 10
        run: |
          set -euo pipefail
          deploy_dir="${{ inputs.deploy_dir }}"
          docker compose --env-file "$deploy_dir/.env" -f "$deploy_dir/docker-compose.yml" pull

      - name: Deploy containers
        timeout-minutes: 10
        run: |
          set -euo pipefail
          deploy_dir="${{ inputs.deploy_dir }}"
          # up -d is idempotent when repeated with the same tag: unchanged images stay as they are, only changed ones are recreated
          docker compose --env-file "$deploy_dir/.env" -f "$deploy_dir/docker-compose.yml" \
            up -d --remove-orphans
          docker compose --env-file "$deploy_dir/.env" -f "$deploy_dir/docker-compose.yml" ps

      # ── Health verification layer 1: local ports on the deploy host ────
      - name: Wait for health (local)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          deploy_dir="${{ inputs.deploy_dir }}"
          # Docker judges health on its own; this adds end-to-end probes:
          # dashboard homepage + admin API through nginx's same-origin reverse
          # proxy + the public discovery endpoint.
          # Ports are fetched one at a time by name (a single grep over two
          # variables returns them in the wrong order, mistaking the public
          # port for the dashboard port).
          read_port() { grep -E "^$1=" "$deploy_dir/.env" | tail -1 | cut -d= -f2; }
          dash_port="$(read_port DASHBOARD_PORT)"
          dash_port="${dash_port:-18088}"
          echo "waiting for dashboard on :$dash_port ..."
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:$dash_port/healthz" >/dev/null 2>&1; then
              echo "dashboard healthy after ${i}0s"
              break
            fi
            if [ "$i" = "40" ]; then
              echo "dashboard did not become healthy" >&2
              docker compose --env-file "$deploy_dir/.env" -f "$deploy_dir/docker-compose.yml" logs --tail 80
              exit 1
            fi
            sleep 10
          done
          echo "--- discovery via dashboard origin (same-origin proxy) ---"
          # The demo fleet takes a few registration/heartbeat beats; only finish once servers actually show up (so the dashboard's first screen has data)
          for i in $(seq 1 12); do
            body="$(curl -fsS "http://127.0.0.1:$dash_port/v1/discovery/servers?limit=3" || true)"
            if printf '%s' "$body" | grep -q '"id"'; then
              echo "demo fleet online (after ${i} tries): $(printf '%s' "$body" | head -c 400)"
              break
            fi
            sleep 5
          done
          echo "--- admin auth via dashboard origin ---"
          # With auth enabled: no key must get 401, the demo key (viewer
          # read-only) must be able to read stats — this step also verifies
          # that the demo account in the README actually works.
          code="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$dash_port/v1/admin/stats" || true)"
          demo_key="$(grep '^ATLAS_ADMIN_API_KEYS=' "$deploy_dir/.env" | tail -1 | cut -d= -f2- | cut -d, -f2 || true)"
          if [ -n "$demo_key" ]; then
            if [ "$code" != "401" ]; then
              echo "auth: expected 401 without key, got $code" >&2
              exit 1
            fi
            echo "no-key → 401 (auth on) ✓"
            curl -fsS -H "Authorization: Bearer $demo_key" \
              "http://127.0.0.1:$dash_port/v1/admin/stats" | head -c 400; echo
          else
            if [ "$code" != "200" ]; then
              echo "admin stats http $code" >&2
              exit 1
            fi
            echo "admin auth disabled (no keys in .env)"
          fi
          echo "--- crossserver config via dashboard origin (404 = 尚未发布，正常) ---"
          curl -sS -o /dev/null -w 'http %{http_code}\n' "http://127.0.0.1:$dash_port/v1/crossserver/config"

      # ── Health verification layer 2: live domain (Cloudflare tunnel) ───
      - name: Verify online (https://atlas.cuihairu.site)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          echo "--- homepage ---"
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors -o /dev/null \
            -w 'HTTP %{http_code} in %{time_total}s\n' https://atlas.cuihairu.site/
          echo "--- healthz through the tunnel ---"
          curl -fsS --retry 8 --retry-delay 3 --retry-all-errors https://atlas.cuihairu.site/healthz
          echo
          echo "--- discovery via the public origin ---"
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            "https://atlas.cuihairu.site/v1/discovery/servers?limit=2" | head -c 300; echo

      # ── Deployment record: live-site verification screenshot ────────────
      # Use zenika/alpine-chrome's one-shot --screenshot; chromedp/headless-shell
      # is a server form driven by a chromedp client — one-shot mode does not
      # take effect there and would hang until timeout.
      # The screenshot is a record, not a health check: failure does not block
      # deployment (continue-on-error), and a curl health probe runs first on
      # this host; if the runner environment cannot run chromium, the curl
      # result is kept instead.
      - name: Screenshot the live site
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -euo pipefail
          deploy_dir="${{ inputs.deploy_dir }}"
          mkdir -p "$deploy_dir/records"
          # Chromium inside the container runs as a non-root user (uid 1000):
          # directories created by the root runner default to 755, which the
          # container cannot write to — write permission must be opened up so a
          # fresh deploy directory has somewhere to save the file
          chmod 777 "$deploy_dir/records"
          # curl health check first on this host; keep the HTTP code as a note
          code="$(curl -fsS --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' https://atlas.cuihairu.site/ || true)"
          echo "online health code: $code"
          # Try the chromium screenshot (if the runner environment lacks system libraries it exits silently; continue-on-error already covers this)
          for i in 1 2 3; do
            if docker run --rm -v "$deploy_dir/records":/shots \
              zenika/alpine-chrome \
              --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size=1440,2000 \
              --virtual-time-budget=10000 \
              --screenshot=/shots/deploy-online.png \
              https://atlas.cuihairu.site/ ; then
              ls -la "$deploy_dir/records/deploy-online.png"
              exit 0
            fi
            echo "screenshot attempt $i failed; retrying in 10s"
            sleep 10
          done
          echo "screenshot failed after 3 attempts" >&2
          # No exit 1 — let the deployment continue; the result may be empty or a stale screenshot, and the Upload step below decides whether any file exists

      - name: Upload screenshot
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v7.0.2
        with:
          name: deploy-screenshot
          path: ${{ inputs.deploy_dir }}/records/deploy-online.png
          if-no-files-found: ignore
          retention-days: 30

      # ── Automatic rollback on failure: restore the previous image tags, re-up and re-verify ─────
      - name: Rollback to previous images
        if: failure()
        timeout-minutes: 10
        run: |
          set -uo pipefail
          deploy_dir="${{ inputs.deploy_dir }}"
          if [ -z "${PREV_ATLAS_TAG:-}" ] && [ -z "${PREV_DASHBOARD_TAG:-}" ]; then
            echo "首次部署失败，没有上一组镜像可回滚——保持现状并报告失败。"
            exit 1
          fi
          echo "回滚：atlas=${PREV_ATLAS_TAG:-<none>} dashboard=${PREV_DASHBOARD_TAG:-<none>}"
          sed -i '/^ATLAS_TAG=/d;/^DASHBOARD_TAG=/d' "$deploy_dir/.env"
          printf 'ATLAS_TAG=%s\nDASHBOARD_TAG=%s\n' \
            "${PREV_ATLAS_TAG:-latest}" "${PREV_DASHBOARD_TAG:-${PREV_ATLAS_TAG:-latest}}" >> "$deploy_dir/.env"
          docker compose --env-file "$deploy_dir/.env" -f "$deploy_dir/docker-compose.yml" pull || true
          docker compose --env-file "$deploy_dir/.env" -f "$deploy_dir/docker-compose.yml" up -d --remove-orphans || true
          docker compose --env-file "$deploy_dir/.env" -f "$deploy_dir/docker-compose.yml" ps || true
          dash_port="$(grep '^DASHBOARD_PORT=' "$deploy_dir/.env" | tail -1 | cut -d= -f2)"
          dash_port="${dash_port:-18088}"
          rolled=0
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:$dash_port/healthz" >/dev/null 2>&1; then
              echo "回滚完成，旧版本在 :$dash_port 恢复健康（部署仍按失败报告）。"
              rolled=1
              break
            fi
            sleep 6
          done
          if [ "$rolled" = "1" ]; then
            # Rollback succeeded: keep the job in a failed state (the deployment
            # itself failed), but this step no longer adds an extra exit 1
            echo "Rollback verified successful — deployment remains failed, rollback step exits 0."
            exit 0
          fi
          echo "回滚后仍未通过健康检查——需要人工介入。" >&2
          docker compose --env-file "$deploy_dir/.env" -f "$deploy_dir/docker-compose.yml" logs --tail 80 || true
          exit 1

      - name: Deploy summary
        if: always()
        timeout-minutes: 3
        run: |
          deploy_dir="${{ inputs.deploy_dir }}"
          {
            echo "### Atlas 部署记录"
            echo
            echo "- 部署 run：<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 镜像标签：\`${{ inputs.tag }}\`（回滚目标：\`${PREV_ATLAS_TAG:-首次部署}\`）"
            echo "- 部署目录：\`$deploy_dir\`"
            echo "- 站点：<https://atlas.cuihairu.site/>（线上验证截图见 artifact \`deploy-screenshot\`）"
            echo "- 结论：${{ job.status }}"
            echo
            echo '```'
            docker compose --env-file "$deploy_dir/.env" -f "$deploy_dir/docker-compose.yml" ps --format '{{.Name}}\t{{.Image}}\t{{.Status}}' 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
