# Dependabot auto-merge: patch version bumps only (changes within x.y.Z).
# Full gates run first (Go build/vet/test + dashboard build + docs site
# build); minor / major bumps are always left for human review. The repo
# needs no branch protection config: this workflow runs the gates itself,
# then merges with --auto --squash.
name: dependabot-auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            docs/package-lock.json

      # ── Gate: Go ─────────────────────────────────────────────
      - name: Go gates
        run: go build ./... && go vet ./... && go test ./...

      # ── Gate: Dashboard ──────────────────────────────────────
      - name: Dashboard build
        working-directory: dashboard
        run: npm ci && npm run build

      # ── Gate: Docs site ──────────────────────────────────────
      - name: Docs build
        working-directory: docs
        run: npm ci && npx vitepress build

      # ── Auto-merge patch bumps only ──────────────────────────
      - name: Auto-merge patch bumps only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          title="$(gh pr view "$PR_URL" --json title -q .title)"
          from="$(sed -E 's/.* from v?([^ ]+) to .*/\1/' <<<"$title")"
          to="$(sed -E 's/.* to v?([^ ]+)$/\1/' <<<"$title")"
          echo "bump: $from -> $to (title: $title)"

          pat='^[0-9]+\.[0-9]+\.[0-9]+'
          if [[ "$from" =~ $pat && "$to" =~ $pat ]]; then
            if [[ "${from%.*}" == "${to%.*}" ]]; then
              # same major.minor → patch bump
              echo "patch bump：自动合并"
              gh pr review "$PR_URL" --approve
              gh pr merge "$PR_URL" --auto --squash
              exit 0
            fi
            echo "minor bump：需要人工评审"
          else
            echo "major / 非 semver 升级：需要人工评审"
          fi
