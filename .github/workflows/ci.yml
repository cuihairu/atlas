# Primary CI gate: Go build / vet / test + coverage reporting.
# Dependabot's auto-merge workflow re-runs these gates on its own; this
# workflow targets every push / PR. Coverage targets: service and handler
# layers >80% (a second quality line beyond the regression thresholds in
# docs/benchmarks.md; see the scope table in docs/security-audit.md).
#
# The three store contract suites (postgres / mysql / redisstore) are gated
# via env vars pointing at the service containers below — same as locally:
#   ATLAS_TEST_DATABASE_URL / ATLAS_TEST_MYSQL_DSN / ATLAS_TEST_REDIS_URL
# Unset means the suites skip automatically; local `go test ./...` stays
# dependency-free.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: atlas_test
          MYSQL_USER: atlas
          MYSQL_PASSWORD: atlas
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ATLAS_TEST_DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas_test?sslmode=disable
      ATLAS_TEST_MYSQL_DSN: atlas:atlas@tcp(127.0.0.1:3306)/atlas_test
      # Dedicated logical DB (15): the suite FlushDBs on every run; no real data coexists here.
      ATLAS_TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Gofmt
        run: |
          dirs="$(go list -f '{{.Dir}}' ./...)"
          if [ -z "$dirs" ]; then
            echo "go list returned no packages; refusing to run gofmt with no args"
            exit 1
          fi
          output="$(gofmt -l $dirs)"
          if [ -n "$output" ]; then
            echo "gofmt needed for:"
            echo "$output"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # golangci-lint (errcheck) — the same surface `make lint` runs locally.
      # go1.27.3 module: use the v2.15.0 binary built against go1.27 so the
      # config loads (golangci-lint must not be older than the module's go
      # directive). Errors are the lint gate itself, not a soft report.
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=10m

      # -coverpkg makes cross-package executed code (the storetest contract
      # suite runs inside the test binaries of all three store packages) count
      # toward coverage faithfully; the block-level dedup below (keeping the
      # max counter) yields a standard-format profile that `go tool cover` and
      # Codecov can both parse directly.
      - name: Test with coverage
        run: |
          go test ./internal/... -coverprofile=coverage.raw -count=1 -coverpkg=./internal/...
          go test ./cmd/... ./sdk/... ./api/... ./examples/... ./deploy/... -count=1
          awk 'NR==1 {next} {
            if (!($1 in stmt)) {order[++n]=$1; stmt[$1]=$2; cnt[$1]=0}
            if ($3+0 > cnt[$1]) cnt[$1]=$3
          } END {
            print "mode: set"
            for (i=1;i<=n;i++) print order[i] " " stmt[order[i]] " " cnt[order[i]]
          }' coverage.raw > coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: Coverage report
        run: |
          go tool cover -func=coverage.out | sed 's/^/  /' > coverage.txt
          # Per-package coverage summary goes into the Actions Summary
          {
            echo "### Go coverage (per package)"
            echo '```'
            go test -cover ./internal/... ./sdk/... 2>&1 | grep -v "no test files"
            echo '```'
            go tool cover -func=coverage.out | tail -1
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      # Upload coverage to Codecov — tokenless, registration-free scheme for
      # public repos (no token; the coverage configuration is driven by the
      # root codecov.yml).
      # Upload failure does not block the gate (fail_ci_if_error: false); Codecov-side
      # rate limiting / outages must not block code merges.
      - uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.out
          # Protected branches (main) force a token: tokenless uploads get
          # rejected by Codecov with "Token required because branch is
          # protected" (verified in practice). Configuring CODECOV_TOKEN in
          # repo Secrets (free from codecov.io) takes effect immediately; when
          # unset it stays empty and behaves like tokenless (failures do not
          # block the gate).
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
