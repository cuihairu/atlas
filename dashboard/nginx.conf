# Atlas 管理台 nginx：SPA 回退 + 同源 API 反代。
# atlas 是 compose 网络里的服务名；/v1 系列按域分流到三个监听口。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 管理 API（优先于 /v1 匹配）→ atlas 管理口
    location /v1/admin/ {
        proxy_pass http://atlas:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 注册域（register / heartbeat / 跨服配置拉取）→ atlas 注册口；
    # 演示域名由此也能承接游戏服的注册与启动拉取。
    location /v1/registry/ {
        proxy_pass http://atlas:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /v1/crossserver/ {
        proxy_pass http://atlas:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其余 /v1（Discovery / Directory / Routing / 公告）→ atlas 公网口
    location /v1/ {
        proxy_pass http://atlas:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源命中即回，未命中的深链接回退 index.html（SPA 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
