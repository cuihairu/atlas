# Atlas dashboard nginx: SPA fallback + same-origin API reverse proxy.
# atlas is the service name on the compose network; /v1 routes are split by
# domain across three listening ports.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Admin API (matched before /v1) → atlas admin port
    location /v1/admin/ {
        proxy_pass http://atlas:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Registry domain (register / heartbeat / cross-server config fetch) → atlas registry port;
    # the demo domain also handles game-server registration and startup fetches here.
    location /v1/registry/ {
        proxy_pass http://atlas:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /v1/crossserver/ {
        proxy_pass http://atlas:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Remaining /v1 (Discovery / Directory / Routing / announcements) → atlas public port
    location /v1/ {
        proxy_pass http://atlas:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # nginx's own liveness: does not go through the try_files SPA fallback
    # (that path would answer /healthz with index.html — a 200 that proves
    # nothing), and does not reach atlas.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Serve static assets on a hit; unmatched deep links fall back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
